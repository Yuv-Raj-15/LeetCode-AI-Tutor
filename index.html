<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 320px;
            margin: 0;
            padding: 15px;
            background-color: #1e1e1e; 
            color: #d4d4d4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .header img {
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }
        .header h3 {
            margin: 0;
            font-size: 16px;
            color: #ffffff;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            flex: 1; 
            padding: 8px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #btn-hint {
            background-color: #0e639c; 
            color: white;
        }
        #btn-hint:hover { background-color: #1177bb; }

        #btn-solve {
            background-color: #2cbb5d;
            color: white;
        }
        #btn-solve:hover { background-color: #239a4c; }

        #loading {
            display: none; 
            font-size: 12px;
            color: #ffcc00;
            text-align: center;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        #txt {
            margin: 0;
            background-color: #252526;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 6px;
            min-height: 60px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: #ce9178; 
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        #txt::-webkit-scrollbar { width: 6px; }
        #txt::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
    </style>
</head>
<body>
    
    <div class="header">
        <img src="img1.jpg" alt="Logo">
        <h3>LeetCode AI Tutor</h3>
    </div>

    <div class="button-group">
        <button id="btn-hint">💡 Get Hint</button>
        <button id="btn-solve">⚡ Fix Code</button>
    </div>

    <div id="loading">Connecting to AI Tutor...</div>
    
    <p id="txt">Ready. Waiting for command.</p>
    
    <script src="app.js"></script>
</body>
</html>
